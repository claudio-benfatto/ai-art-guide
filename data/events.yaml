  source_type: curated
  accessibility_notes: Fully accessible, tactile tours available
  booking_url: https://www.fmirobcn.org
- id: evt_004
  title_en: 'Digital Futures: Interactive Installations'
  title_es: 'Futuros Digitales: Instalaciones Interactivas'
  description_en: Experience cutting-edge digital art installations that blur the
    boundaries between viewer and artwork. This immersive exhibition invites active
    participation through motion sensors, VR, and generative algorithms.
  description_es: Experimenta instalaciones de arte digital de vanguardia que difuminan
    los límites entre espectador y obra de arte. Esta exposición inmersiva invita
    a la participación activa mediante sensores de movimiento, RV y algoritmos generativos.
  tags:
  - digital
