- id: evt_002
  title_en: 'Street Art Walking Tour: El Raval'
  title_es: 'Tour de Arte Urbano: El Raval'
  description_en: Discover hidden murals and graffiti masterpieces in Barcelona's
    vibrant El Raval neighborhood. This guided walk explores the intersection of street
    culture, political expression, and contemporary urban aesthetics.
  description_es: Descubre murales ocultos y obras maestras de graffiti en el vibrante
    barrio de El Raval de Barcelona. Este paseo guiado explora la intersección de
    la cultura callejera, la expresión política y la estética urbana contemporánea.
  tags:
  - street
  - urban
  - contemporary
  - political
  category: street
  domain: null
  start_date: 2025-11-18
  end_date: 2025-12-20
  venue_id: v_02
  cost_bucket: free
  outdoor: true
  latitude: 41.3801
  longitude: 2.17
  source_type: curated
  accessibility_notes: Outdoor walking tour, uneven surfaces
  booking_url: null
- id: evt_003
  title_en: 'Surrealist Dreams: Miró and Beyond'
  title_es: 'Sueños Surrealistas: Miró y Más Allá'
  description_en: Immerse yourself in the fantastical world of Joan Miró and his surrealist
    contemporaries. This exhibition showcases paintings, sculptures, and installations
    that challenge perception and embrace the subconscious.
  description_es: Sumérgete en el mundo fantástico de Joan Miró y sus contemporáneos
    surrealistas. Esta exposición presenta pinturas, esculturas e instalaciones que
    desafían la percepción y abrazan el subconsciente.
  tags:
  - surrealism
  - painting
  - sculpture
  - abstract
  category: museum
  domain: null
