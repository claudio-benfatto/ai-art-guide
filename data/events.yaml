- id: evt_006
  title_en: Gothic Quarter Hidden Gems
  title_es: Joyas Escondidas del Barrio Gótico
  description_en: Uncover medieval and Renaissance art treasures tucked away in Gothic
    Quarter churches and historic buildings. This curated tour reveals lesser-known
    masterpieces spanning centuries of Catalan artistic tradition.
  description_es: Descubre tesoros de arte medieval y renacentista escondidos en iglesias
    y edificios históricos del Barrio Gótico. Este tour curado revela obras maestras
    menos conocidas que abarcan siglos de tradición artística catalana.
  tags:
  - baroque
  - renaissance
  - educational
  category: street
  domain: null
