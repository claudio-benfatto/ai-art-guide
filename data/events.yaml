- id: evt_002
  title_en: 'Street Art Walking Tour: El Raval'
  title_es: 'Tour de Arte Urbano: El Raval'
  description_en: Discover hidden murals and graffiti masterpieces in Barcelona's
    vibrant El Raval neighborhood. This guided walk explores the intersection of street
    culture, political expression, and contemporary urban aesthetics.
  description_es: Descubre murales ocultos y obras maestras de graffiti en el vibrante
    barrio de El Raval de Barcelona. Este paseo guiado explora la intersección de
    la cultura callejera, la expresión política y la estética urbana contemporánea.
  tags:
    - street
    - urban
