- id: evt_007
  title_en: Emerging Artists Open Studios
  title_es: Estudios Abiertos de Artistas Emergentes
  description_en: Visit working studios of emerging contemporary artists in the Poblenou
    creative district. Experience works in progress across multiple media including
    painting, sculpture, and mixed media installations.
  description_es: Visita estudios de trabajo de artistas contemporáneos emergentes
    en el distrito creativo de Poblenou. Experimenta obras en progreso en múltiples
    medios incluyendo pintura, escultura e instalaciones de medios mixtos.
  tags:
