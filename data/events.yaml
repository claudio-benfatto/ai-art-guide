  title_es: 'Sueños Surrealistas: Miró y Más Allá'
  description_en: Immerse yourself in the fantastical world of Joan Miró and his surrealist
    contemporaries. This exhibition showcases paintings, sculptures, and installations
    that challenge perception and embrace the subconscious.
  description_es: Sumérgete en el mundo fantástico de Joan Miró y sus contemporáneos
    surrealistas. Esta exposición presenta pinturas, esculturas e instalaciones que
    desafían la percepción y abrazan el subconsciente.
