- id: evt_001
  title_en: Modern Photography Retrospective
  title_es: Retrospectiva de Fotografía Moderna
  description_en: Explore the evolution of modern photography through iconic works
    from the 20th century. This exhibition features pioneers who revolutionized visual
    storytelling through experimental techniques and bold compositional choices.
  description_es: Explora la evolución de la fotografía moderna a través de obras
    icónicas del siglo XX. Esta exposición presenta pioneros que revolucionaron la
    narrativa visual mediante técnicas experimentales y elecciones compositivas audaces.
  tags:
  - modern
  - photography
  - contemporary
  category: museum
  domain: null
  start_date: 2025-11-20
  end_date: 2026-01-15
  venue_id: v_01
