- id: evt_005
  title_en: 'Feminist Perspectives: Women in Contemporary Art'
  title_es: 'Perspectivas Feministas: Mujeres en el Arte Contemporáneo'
  description_en: A powerful collection highlighting female artists challenging patriarchal
    narratives through diverse media including painting, video, and performance documentation.
    This exhibition centers voices historically marginalized in art discourse.
  description_es: Una poderosa colección que destaca a artistas femeninas que desafían
    las narrativas patriarcales a través de diversos medios, incluidos pintura, video
    y documentación de performance. Esta exposición centra voces históricamente marginadas
    en el discurso artístico.
  tags:
  - feminist
  - contemporary
  - political
  - mixed-media
  category: cultural-center
