[tool.poetry]
name = "ai-art-guide"
version = "0.1.0"
description = "Barcelona AI Art Guide - Personalized art event recommendations"
authors = ["Claudio Benfatto <claudio.benfatto@gmail.com>"]
readme = "README.md"
packages = [{include = "adk", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.0.0"
pyyaml = "^6.0"
numpy = "^1.24.0"
sentence-transformers = "^2.7.0"
faiss-cpu = "^1.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"

[tool.poetry.group.future]
optional = true

[tool.poetry.group.future.dependencies]
# Future dependencies for MVP expansion
google-cloud-firestore = "^2.13.0"  # User profiles, session storage
google-cloud-storage = "^2.10.0"    # Raw data storage
vertexai = "^1.38.0"                # Embeddings and generation
numpy = "^1.24.0"                   # Vector operations
scikit-learn = "^1.3.0"             # Cosine similarity

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/adk/models",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
